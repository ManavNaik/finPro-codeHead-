<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>📊 Monthly Stats - Finance App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-100 via-purple-100 to-purple-200 font-sans flex">

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 h-screen w-64 bg-gradient-to-b from-purple-900 to-gray-900 text-white flex flex-col justify-between p-6 border-r border-purple-700/40 shadow-2xl">
    <div>
      <!-- Logo -->
      <div class="flex items-center gap-3 mb-12">
        <img src="assets/hero-finance.jpg" alt="Finance Logo" class="w-12 h-12 rounded-xl shadow-md">
        <h2 class="text-2xl font-extrabold tracking-wide">Finance App</h2>
      </div>

      <!-- Navigation -->
      <nav class="space-y-3">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800/50 hover:bg-purple-600/70 hover:translate-x-2 transition-all duration-300">
          🏠 <span>Dashboard</span>
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800/50 hover:bg-purple-600/70 hover:translate-x-2 transition-all duration-300">
          👤 <span>Profile</span>
        </a>
        <a href="monthly.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-purple-700/40 hover:bg-purple-600/70 hover:translate-x-2 transition-all duration-300">
          📊 <span>Monthly Stats</span>
        </a>
        <a href="investments.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-800/50 hover:bg-purple-600/70 hover:translate-x-2 transition-all duration-300">
          💼 <span>Investments</span>
        </a>
      </nav>
    </div>

    <!-- Logout -->
    <button class="px-4 py-3 mt-6 bg-gradient-to-r from-red-500 to-red-600 rounded-xl hover:scale-105 transition-all duration-300 font-bold shadow-lg">
      Logout
    </button>
  </aside>

  <!-- Main Content -->
  <main class="ml-64 flex-1 p-10 min-h-screen relative">
    <!-- Dynamic Balance Label -->
    <div class="absolute top-10 right-10 bg-purple-600 text-white px-6 py-3 rounded-xl shadow-lg text-lg font-bold">
      Balance: $<span id="totalBalance">0</span>
    </div>

    <section class="mb-12">
      <h1 class="text-4xl font-extrabold text-gray-800 mb-6">Monthly Stats</h1>
      
      <!-- Salary Input -->
      <div class="mb-6 flex gap-4 items-center">
        <label class="text-gray-700 font-semibold">Monthly Salary:</label>
        <input type="number" id="salaryInput" placeholder="$0.00" class="p-2 rounded-xl border border-gray-300 shadow-sm w-48">
        <button id="saveSalary" class="px-4 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700 transition-all duration-300">Save</button>
      </div>

      <!-- Credit/Debit Input -->
      <div class="mb-6 flex gap-4 items-center">
        <label class="text-gray-700 font-semibold">Amount:</label>
        <input type="number" id="transactionAmount" placeholder="$0.00" class="p-2 rounded-xl border border-gray-300 shadow-sm w-48">
        <button id="creditBtn" class="px-4 py-2 bg-green-600 text-white rounded-xl hover:bg-green-700 transition-all duration-300">Credit</button>
        <button id="debitBtn" class="px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition-all duration-300">Debit</button>
      </div>

      <!-- Transactions Table -->
      <div class="overflow-x-auto bg-white/70 backdrop-blur-md rounded-2xl shadow-lg p-6">
        <table class="min-w-full table-auto border-collapse border border-gray-300">
          <thead>
            <tr class="bg-purple-200 text-gray-800">
              <th class="border border-gray-300 px-4 py-2">Date</th>
              <th class="border border-gray-300 px-4 py-2">Type</th>
              <th class="border border-gray-300 px-4 py-2">Amount</th>
            </tr>
          </thead>
          <tbody id="transactionsTable" class="text-gray-700">
            <!-- Transactions will appear here -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- JS -->
  <script>
    let totalBalance = 0;

    // Update Balance Display
    const updateBalance = () => {
      document.getElementById('totalBalance').textContent = totalBalance.toFixed(2);
    };

    // Save Salary
    document.getElementById('saveSalary').addEventListener('click', () => {
      const salary = parseFloat(document.getElementById('salaryInput').value) || 0;
      totalBalance = salary;
      updateBalance();
      alert(`Monthly Salary set to $${salary.toFixed(2)}`);
    });

    // Add transaction
    const table = document.getElementById('transactionsTable');
    const addTransaction = (type) => {
      const amount = parseFloat(document.getElementById('transactionAmount').value);
      if(!amount) return alert("Enter an amount!");
      
      // Update total balance
      totalBalance = type === 'Credit' ? totalBalance + amount : totalBalance - amount;
      updateBalance();

      // Format amount with + or - sign
      const displayAmount = type === 'Credit' ? `+ $${amount.toFixed(2)}` : `- $${amount.toFixed(2)}`;
      const colorClass = type === 'Credit' ? 'text-green-600' : 'text-red-600';

      // Add transaction to table
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="border border-gray-300 px-4 py-2">${new Date().toLocaleDateString()}</td>
        <td class="border border-gray-300 px-4 py-2">${type}</td>
        <td class="border border-gray-300 px-4 py-2 ${colorClass}">${displayAmount}</td>
      `;
      table.appendChild(row);

      document.getElementById('transactionAmount').value = '';
    };

    document.getElementById('creditBtn').addEventListener('click', () => addTransaction('Credit'));
    document.getElementById('debitBtn').addEventListener('click', () => addTransaction('Debit'));
  </script>
</body>
</html>
